name: Monitoring úředních desek

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/monitor.yml'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: municipal-board-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      AI_MODEL: ${{ vars.AI_MODEL }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL }}
      MAX_AI_CALLS: '10'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalace
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-ces
      - name: Testy
        run: python -m unittest discover -s tests -v
      - name: Načtení předchozího stavu
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.github load
      - name: Kontrola desek
        id: scan
        continue-on-error: true
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python -m app.cli
      - name: Uložení výsledků
        run: python -m app.github save
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Přehled běhu
        if: always()
        run: |
          if [ -f output/latest.md ]; then
            cat output/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upozornění přes GitHub Issue
        id: notify
        continue-on-error: true
        if: vars.NOTIFY_ISSUES != 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.github notify
      - name: Uložení stavu doručení
        if: steps.notify.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m app.github save
      - name: Kontrola výsledku
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          NOTIFY_OUTCOME: ${{ steps.notify.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != 'success' ] || [ "$NOTIFY_OUTCOME" = 'failure' ]; then
            echo 'Část monitoringu selhala. Otevřete přehled běhu a ověřte výsledky.'
            exit 1
          fi
